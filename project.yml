name: HelloApp
options:
  bundleIdPrefix: com.example
targets:
  HelloApp:
    type: application
    platform: iOS
    deploymentTarget: "16.0"
    sources: [HelloApp]
    settings:
      GENERATE_INFOPLIST_FILE: YES
      PRODUCT_BUNDLE_IDENTIFIER: com.example.helloapp
      INFOPLIST_KEY_UILaunchScreen_Generation: YES

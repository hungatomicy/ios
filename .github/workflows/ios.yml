name: iOS Build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - name: Cài XcodeGen
        run: brew install xcodegen

      - name: Tạo file project
        run: xcodegen generate

      - name: Build
        run: |
          xcodebuild build \
            -project HelloApp.xcodeproj \
            -scheme HelloApp \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
